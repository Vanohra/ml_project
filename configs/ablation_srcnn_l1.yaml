# configs/ablation_srcnn_l1.yaml
# --------------------------------
# Ablation experiment A: SimpleSRCNN with L1 loss, generic degradation.
# This is the simplest possible configuration — the baseline to beat.
#
# Run:
#   python scripts/run_experiment.py --config configs/ablation_srcnn_l1.yaml

experiment:
  name: ablation_srcnn_l1
  seed: 42

model:
  name: srcnn

data:
  hr_train_dir: data/DIV2K/HR_train
  hr_valid_dir: data/DIV2K/HR_valid
  lr_train_dir: data/DIV2K/LR_train
  lr_valid_dir: data/DIV2K/LR_valid
  use_online_degradation: true
  domain: null                  # generic Stage 2 degradation

training:
  num_epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  patch_size: 48
  scale: 4
  log_every: 10

output:
  base_dir: outputs/experiments
  save_samples_every: 5
  num_sample_images: 4

loss:
  pixel:
    type: l1
    weight: 1.0
  perceptual:
    enabled: false

curriculum:
  enabled: false
  stages:
    - name: easy
      start_epoch: 1
      blur_sigma: [0.2, 1.0]
      noise_sigma: [0, 8]
      noise_probability: 0.50
      jpeg_quality: [80, 95]
      jpeg_probability: 0.70
      second_stage_probability: 0.0
    - name: medium
      start_epoch: 20
      blur_sigma: [0.3, 2.5]
      noise_sigma: [5, 25]
      noise_probability: 0.75
      jpeg_quality: [50, 85]
      jpeg_probability: 0.85
      second_stage_probability: 0.30
    - name: hard
      start_epoch: 40
      blur_sigma: [0.5, 4.0]
      noise_sigma: [10, 45]
      noise_probability: 0.90
      jpeg_quality: [20, 70]
      jpeg_probability: 0.95
      second_stage_probability: 0.70
