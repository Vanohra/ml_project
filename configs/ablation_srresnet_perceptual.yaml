# configs/ablation_srresnet_perceptual.yaml
# ------------------------------------------
# Ablation experiment C: SRResNet with pixel L1 + VGG16 perceptual loss.
# Same architecture and domain as experiment B — only the loss changes.
# Comparing B vs C isolates the effect of perceptual loss on visual quality.
#
# What changes vs B:
#   loss.perceptual.enabled: true   (adds VGG16 relu2_2 feature loss)
#   loss.perceptual.weight:  0.1    (safe range: 0.05–0.1)
#
# First run downloads VGG16 weights (~58 MB) from PyTorch Hub automatically.
#
# Run:
#   python scripts/run_experiment.py \
#       --config configs/ablation_srresnet_perceptual.yaml \
#       --noref_dir data/RealSRSet

experiment:
  name: ablation_srresnet_perceptual
  seed: 42

model:
  name: srresnet
  num_res_blocks: 8
  num_features: 64

data:
  hr_train_dir: data/DIV2K/HR_train
  hr_valid_dir: data/DIV2K/HR_valid
  lr_train_dir: data/DIV2K/LR_train
  lr_valid_dir: data/DIV2K/LR_valid
  use_online_degradation: true
  domain: surveillance

training:
  num_epochs: 100
  batch_size: 16
  learning_rate: 0.0001
  patch_size: 48
  scale: 4
  log_every: 10

output:
  base_dir: outputs/experiments
  save_samples_every: 5
  num_sample_images: 4

loss:
  pixel:
    type: l1
    weight: 1.0
  perceptual:
    enabled: true               # <-- the only difference from ablation_srresnet_l1
    weight: 0.1
    layer: relu2_2

curriculum:
  enabled: false
  stages:
    - name: easy
      start_epoch: 1
      blur_sigma: [0.2, 1.0]
      noise_sigma: [0, 8]
      noise_probability: 0.50
      jpeg_quality: [80, 95]
      jpeg_probability: 0.70
      second_stage_probability: 0.0
    - name: medium
      start_epoch: 34
      blur_sigma: [0.3, 2.5]
      noise_sigma: [5, 25]
      noise_probability: 0.75
      jpeg_quality: [50, 85]
      jpeg_probability: 0.85
      second_stage_probability: 0.30
    - name: hard
      start_epoch: 67
      blur_sigma: [0.5, 4.0]
      noise_sigma: [10, 45]
      noise_probability: 0.90
      jpeg_quality: [20, 70]
      jpeg_probability: 0.95
      second_stage_probability: 0.70
